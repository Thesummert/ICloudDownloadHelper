[package]
name = "icloud-download-helper"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
description = "跨平台 iCloud 照片并发下载工具"
license = "MIT"

[[bin]]
name = "icloud-dl"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
dialoguer = "0.12"
directories = "6"
futures-util = "0.3"
indicatif = "0.18"
num-bigint = "0.4"
pbkdf2 = "0.12"
rand = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "cookies", "json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "io-util", "signal", "time"] }
uuid = { version = "1", features = ["v4"] }
zeroize = "1"

[dev-dependencies]
tempfile = "3"
